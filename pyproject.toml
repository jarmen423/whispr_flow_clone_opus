[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localflow-agent"
version = "1.0.0"
description = "LocalFlow desktop agent — system-wide dictation via global hotkeys."
readme = "agent/README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LocalFlow" }]
keywords = ["dictation", "speech-to-text", "whisper", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.0.0",
    "pycaw>=20240210",  # Windows Core Audio control (master volume mute) for auto-mute during dictation
]

[project.scripts]
localflow-agent = "localflow_agent:main"
localflow-recover = "localflow_agent:recover_main"

[project.urls]
Homepage = "https://dictate.agentmemorylabs.com"
Repository = "https://github.com/jarmen423/whispr_flow_clone_opus"

[tool.hatch.build.targets.wheel]
packages = ["agent/localflow_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "agent/localflow_agent",
    "agent/README.md",
    "agent/requirements.txt",
    "agent/version.txt",
]
